apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: openkruise-nfs-dynamic-mount-demo
  namespace: openkruise-sandbox-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openkruise-nfs-dynamic-mount-demo
  template:
    metadata:
      labels:
        app: openkruise-nfs-dynamic-mount-demo
    spec:
      serviceAccountName: sandbox-mounter
      automountServiceAccountToken: false
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 360000
