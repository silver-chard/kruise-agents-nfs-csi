fullnameOverride: ""
namespace: ""

driverName: csi.nfs.zhida
tokenAudience: kruise-agents-nfs-csi.zhida/sandbox-mounter

imagePullSecrets: []

images:
  wrapper:
    # Build and publish this image before installing the chart.
    repository: ghcr.io/example/kruise-agents-nfs-csi-wrapper
    tag: v0.0.2
    pullPolicy: IfNotPresent
  mounter:
    # Build and publish this image before using the sidecar integration.
    repository: ghcr.io/example/kruise-agents-nfs-csi-mounter
    tag: v0.0.2
    pullPolicy: IfNotPresent
  provisioner:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v6.1.0
    pullPolicy: IfNotPresent
  resizer:
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: v2.0.0
    pullPolicy: IfNotPresent
  registrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.15.0
    pullPolicy: IfNotPresent
  livenessProbe:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.17.0
    pullPolicy: IfNotPresent

controller:
  replicas: 1
  serviceAccountName: ""
  leaderElectionNamespace: sandbox-system
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/controlplane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

node:
  serviceAccountName: ""
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
  hostNetwork: true
  hostPID: true

paths:
  kubeletPods: /var/lib/kubelet/pods
  pluginDir: /var/lib/kubelet/plugins/csi-nfs-zhida
  registrationDir: /var/lib/kubelet/plugins_registry
  wrapperStateDir: /var/lib/kruise-agents-nfs-csi
  wrapperSocketPath: /var/lib/kruise-agents-nfs-csi/wrapper.sock
  wrapperStagingRoot: /var/lib/kruise-agents-nfs-csi/staging
  wrapperMountStateDir: /var/lib/kruise-agents-nfs-csi/mounts

wrapper:
  enableMount: true
  unstageAfterMount: true
  createMissingSubPaths: false
  createdSubPathMode: "0770"
  socketGroup: 2000
  socketDirMode: "0770"
  socketMode: "0660"

storageClass:
  create: true
  name: nfs-csi
  reclaimPolicy: Delete
  allowVolumeExpansion: true
  volumeBindingMode: Immediate
  mountOptions:
    - nfsvers=4.1
    - hard
    - nordirplus
  parameters:
    mountPermissions: "0755"
    server: ""
    share: /
